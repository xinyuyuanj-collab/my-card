<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人作品主页</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    h1 { margin: 10px 0 5px; font-size: 24px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    .btn {
      display: block;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { background: #2563eb; transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 50px;">🚀</div>
    <h1>你好，欢迎来到我的作品集！</h1>
    <p>这是我用 GitHub Pages 发布的第一个独立网页</p>
    <a href="https://github.com/xinyuyuanj-collab" class="btn" target="_blank">访问我的 GitHub 主页</a>
    <a href="mailto:xinyuyuanj@gmail.com" class="btn btn-secondary">发邮件联系我</a>
  </div>
</body>
</html>
